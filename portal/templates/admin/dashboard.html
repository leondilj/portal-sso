{% extends "admin/_base.html" %}

{% block title %}Administracao - Portal SSO{% endblock %}

{% block admin_content %}
  <div class="page-header">
    <div>
      <h2>Administracao</h2>
      <p class="page-header__subtitle">Logado como {{ session.email }}.</p>
    </div>
  </div>

  <div class="dashboard-grid">
    <a class="dashboard-card" href="/admin/sistemas">
      <span class="dashboard-card__icon">&#9881;</span>
      <span class="dashboard-card__title">Sistemas</span>
      <span class="dashboard-card__desc">Aplicacoes, credenciais OAuth e perfis de acesso.</span>
    </a>
    <a class="dashboard-card" href="/admin/usuarios">
      <span class="dashboard-card__icon">&#128100;</span>
      <span class="dashboard-card__title">Usuarios</span>
      <span class="dashboard-card__desc">Buscar, criar usuarios e conceder perfis.</span>
    </a>
  </div>
{% endblock %}
