{% extends "admin/_base.html" %}

{% block title %}{{ acao }} cliente OAuth - Portal SSO{% endblock %}

{% block admin_content %}
  <h2>{{ acao }} cliente OAuth - {{ sistema.nome }}</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Redirect URI<input type="url" name="redirect_uri" value="{{ redirect_uri }}" required></label>
    <button type="submit">{{ acao }}</button>
  </form>
  <p><a href="/admin/sistemas/{{ sistema.id }}">Voltar</a></p>
{% endblock %}
