{% extends "admin/_base.html" %}

{% block title %}Novo sistema - Portal SSO{% endblock %}

{% block admin_content %}
  <div class="page-header">
    <h2>Novo sistema</h2>
  </div>

  <div class="form-card">
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/sistemas/novo">
      <label>
        ID (usado como identificador do cliente, ex.: "vendas")
        <input type="text" name="aplicacao_id" required pattern="[a-z0-9_-]+">
      </label>
      <label>Nome<input type="text" name="nome" required></label>
      <label>Descricao<input type="text" name="descricao"></label>
      <label>URL<input type="url" name="url" required></label>
      <label>Icone (opcional)<input type="text" name="icone"></label>
      <label>Ordem<input type="number" name="ordem" value="0"></label>
      <button type="submit" class="btn btn-primary">Criar</button>
    </form>
  </div>
{% endblock %}
