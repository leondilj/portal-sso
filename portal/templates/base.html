<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portal SSO{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% block body %}
    <div class="bare-shell">
      <header class="bare-header">
        <a class="brand" href="/">
          <img class="brand__logo" src="/static/img/logo.png" alt="Kover">
        </a>
      </header>
      <main class="{% block main_class %}bare-main{% endblock %}">
        {% block content %}{% endblock %}
      </main>
    </div>
  {% endblock %}
</body>
</html>
